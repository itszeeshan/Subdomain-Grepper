name: Bug report
description: Report a problem with SubdomainX
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.
        Do **not** report security vulnerabilities here — see [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the exact command, flags, and config used.
      placeholder: |
        1. Run `subdomainx --subfinder --httpx example.com`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / output
      description: Paste relevant output. Redact any secrets or sensitive data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SubdomainX version
      description: Output of `subdomainx --version` (or release/commit).
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / platform
      placeholder: e.g. macOS 14, Ubuntu 22.04, Go 1.21
    validations:
      required: true
  - type: checkboxes
    id: policy
    attributes:
      label: Acknowledgements
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I have read the [AI Usage Policy](../../AI_USAGE_POLICY.md) and this report is written in my own words.
          required: true
