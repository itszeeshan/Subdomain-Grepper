        <!-- ── Subdomains Tab ── -->
        <div id="tab-subdomains" class="section-hidden">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-count" id="subdomain-count-badge" style="display:none">{{.SubdomainCount}} total</span>
                    <div class="panel-actions">
                        <button class="btn-sm" onclick="exportData('subdomains','csv')"><i data-lucide="download" style="width:12px;height:12px"></i> CSV</button>
                        <button class="btn-sm" onclick="exportData('subdomains','json')"><i data-lucide="file-json" style="width:12px;height:12px"></i> JSON</button>
                    </div>
                </div>
                {{if gt .SubdomainCount 0}}
                <div style="overflow-x:auto">
                    <table id="subdomains-table">
                        <thead>
                            <tr>
                                <th onclick="sortTable('subdomains','subdomain')">Subdomain <span class="sort-arrow" id="sort-subdomains-subdomain"></span></th>
                                <th onclick="sortTable('subdomains','parent')">Parent <span class="sort-arrow" id="sort-subdomains-parent"></span></th>
                                <th onclick="sortTable('subdomains','source')">Source <span class="sort-arrow" id="sort-subdomains-source"></span></th>
                                <th onclick="sortTable('subdomains','ips')">IP Addresses <span class="sort-arrow" id="sort-subdomains-ips"></span></th>
                            </tr>
                        </thead>
                        <tbody id="subdomains-tbody"></tbody>
                    </table>
                </div>
                <div class="pagination">
                    <span class="pagination-info" id="subdomains-info"></span>
                    <div class="pag-buttons">
                        <button class="pag-btn" id="subdomain-prev" onclick="subdomainsPage(-1)">Previous</button>
                        <button class="pag-btn" id="subdomain-next" onclick="subdomainsPage(1)">Next</button>
                    </div>
                </div>
                {{else}}
                <div class="empty-state">No subdomains found.</div>
                {{end}}
            </div>
        </div>
