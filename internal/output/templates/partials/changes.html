        <!-- ── Changes Tab ── -->
        {{if .HasDiff}}
        <div id="tab-changes" class="section-hidden">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-count" id="changes-count-badge" style="display:none">0 changes</span>
                    <div class="panel-actions">
                        <button class="btn-sm" onclick="exportData('changes','json')"><i data-lucide="file-json" style="width:12px;height:12px"></i> Export Diff</button>
                    </div>
                </div>
                <div class="diff-section" id="diff-content"></div>
            </div>
        </div>
        {{end}}
